name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown lint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.11.10
          install_args: prek rumdl
      - name: Lint all Markdown
        run: mise run check-hooks

  hugo:
    name: Hugo (${{ matrix.target }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [beta, production]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: true
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.11.10
          install_args: hugo-extended node
      - name: Initialize active theme
        run: git submodule update --init --recursive themes/DoIt
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: mise run "build:$TARGET"
      - name: Test release validation
        run: mise run test:release
